map $http_x_wordme_token $wordme_token_allowed {
    default 0;
    include /etc/nginx/secrets/wordme-token.map;
}

map $http_x_wordme_debug_token $wordme_debug {
    default 0;
    include /etc/nginx/secrets/wordme-debug-token.map;
}

# $ip_allowed is a geo block in nginx.conf shared with mejourney.
map "$wordme_token_allowed:$ip_allowed" $wordme_allowed {
    default 0;
    "1:0" 1;
    "0:1" 1;
    "1:1" 1;
}
